<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'User Management'"></title>
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <div class="logo">🚤</div>
      <div class="brand-text">
        <div class="title">Boat Safari</div>
        <div class="subtitle">User Management</div>
      </div>
    </div>
    <nav class="top-nav" data-nav>
      <a th:href="@{/ui}" th:classappend="${active} == 'dashboard' ? ' is-active'">Dashboard</a>
      <a th:href="@{/ui/create}" th:classappend="${active} == 'create' ? ' is-active'">Create User</a>
      <a th:href="@{/ui/profile}" th:classappend="${active} == 'profile' ? ' is-active'">Profile</a>
      <a th:href="@{/ui/permissions}" th:classappend="${active} == 'permissions' ? ' is-active'">Permissions</a>
      <a th:href="@{/ui/delete}" th:classappend="${active} == 'delete' ? ' is-active'">Delete Account</a>
    </nav>
  </header>

  <main class="app-main">
    <div class="container">
      <section class="page">
        <th:block th:insert="~{::main}"></th:block>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <footer class="app-footer">
    <div class="container">
      <span>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}"></span> Boat Safari Trip Management</span>
    </div>
  </footer>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
